org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
# Путь проекта содержит кириллицу («ИЩЕЙКА»), и плагин Android по умолчанию
# отказывается собирать. Сборка проверена и проходит; если возникнут странные
# ошибки путей - собирайте копию проекта в каталоге с латинским именем.
android.overridePathCheck=true
